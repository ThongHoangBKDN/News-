name: ban-tin

on:
  schedule:
    - cron: '0 23 * * *' # Tự động chạy lúc 6h sáng giờ Việt Nam
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run digest builder script
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -f scripts/build_digest.py ]; then
            python scripts/build_digest.py
          else
            echo "Chưa có file scripts/build_digest.py"
          fi
